<div class="row mb-3">
  <div class="col-md-3">
    <input 
      class="form-control" 
      placeholder="BuyerPhoneNumber" 
      [(ngModel)]="orderParams.buyerPhoneNumber" 
      (ngModelChange)="applyFilter()">
  </div>

  <div class="col-md-3">
    <select 
      class="form-select" 
      [(ngModel)]="orderParams.orderStatus"
      (ngModelChange)="onStatusChange($event)">
        <option [ngValue]="orderStatusFilter.All">All</option>
        <option [ngValue]="orderStatusFilter.Pending">Pending</option>
        <option [ngValue]="orderStatusFilter.PaymentSuccess">Payment Success</option>
        <option [ngValue]="orderStatusFilter.PaymentFailed">Payment Failed</option>
        <option [ngValue]="orderStatusFilter.Shipped">Shipped</option>
        <option [ngValue]="orderStatusFilter.Delivered">Delivered</option>
        <option [ngValue]="orderStatusFilter.Cancelled">Cancelled</option>
      <!-- <option [ngValue]="null">All Status</option> -->
      <!-- @for(s of orderStatuses; track $index){
        <option [ngValue]="s">{{ s }}</option>
      } -->
    </select>
  </div>
  <div class="col-md-3">
    <input type="date" class="form-control" [(ngModel)]="orderParams.fromDate" (ngModelChange)="applyFilter()">
  </div>
  <div class="col-md-3">
    <input type="date" class="form-control" [(ngModel)]="orderParams.toDate" (ngModelChange)="applyFilter()">
  </div>

  <div class="col-md-3 mt-3">
    <button class="btn btn-primary w-100" (click)="applyFilter()">
      Filter
    </button>
  </div>

<div class="col-md-3 mt-3">
    <button class="btn btn-secondary w-100" (click)="onReset()">
      Reset
    </button>
  </div>
</div>


<table class="table table-striped">
  <thead>
    <tr>
      <th (click)="applySort('id')">Order ID <i [class]="sortBy==='id' ? (sortDesc?'fas fa-sort-down':'fas fa-sort-up'):'fas fa-sort'"></i></th>
      <th (click)="applySort('BuyerPhoneNumber')">User <i [class]="sortBy==='BuyerPhoneNumber' ? (sortDesc?'fas fa-sort-down':'fas fa-sort-up'):'fas fa-sort'"></i></th>
      <th (click)="applySort('OrderStatus')">OrderStatus <i [class]="sortBy==='OrderStatus' ? (sortDesc?'fas fa-sort-down':'fas fa-sort-up'):'fas fa-sort'"></i></th>
      <!-- <th (click)="applySort('Total')">Total <i [class]="sortBy==='Total' ? (sortDesc?'fas fa-sort-down':'fas fa-sort-up'):'fas fa-sort'"></i></th> -->
      <th (click)="applySort('Created')">Created <i [class]="sortBy==='Created' ? (sortDesc?'fas fa-sort-down':'fas fa-sort-up'):'fas fa-sort'"></i></th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for(order of orders; track $index){
      <tr>
      <td>{{ order.id }}</td>
      <td>{{ order.buyerPhoneNumber }}</td>
      <td>
        <select [(ngModel)]="order.orderStatus" 
                (ngModelChange)="changeOrderStatus(order.id, $event)"
                class="form-select form-select-sm">
          @for(s of orderStatuses; track $index){
            <option [ngValue]="s">{{ s }}</option>
          }
        </select>
      </td>
      <td>{{ order.total | currency }}</td>
      <td>{{ order.created | date:'mediumDate'}}</td>
      <td>
        <button class="btn btn-info btn-sm" (click)="showOrder(order)">
          View Detail
        </button>
      </td>
    </tr>
    }
  </tbody>
</table>
