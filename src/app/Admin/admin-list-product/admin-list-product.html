<div class="container mt-4">
  <div class="row">
    <div class="flex justify-content-between">
      <h3>Product List</h3>

    <button class="btn btn-success mb-3" routerLink="/admin/product/create">
      + Create Product
    </button>
    </div>
  </div>

  <div class="d-flex mb-3">
  <input type="text" class="form-control me-2" #search
         placeholder="Search..."
         [(ngModel)]="productParams.search"
         (keyup)="onSearch()">

  <button class="btn btn-primary" (click)="onSearch()">Search</button>
</div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Image</th>
        <th>Title</th>
        <th>Price</th>
        <th>Brand</th>
        <th>Type</th>
        <th style="width:160px"></th>
      </tr>
    </thead>

    <tbody>
     @for(p of data?.result; track p.id){
         <tr>
        <td>{{p.id}}</td>
        <td><img [src]="getImageUrl(p.mainImage)" width="60"></td>
        <td>{{p.title}}</td>
        <td>{{p.price}}</td>
        <td>{{p.productBrand}}</td>
        <td>{{p.productType}}</td>

        <td>
          <button class="btn btn-primary btn-md" (click)="Detail(p.id)"><i class="fas fa-eye"></i></button>
          <button class="btn btn-warning btn-md ms-2" (click)="edit(p.id)"><i class="fas fa-edit"></i></button>
          <button class="btn btn-danger btn-md ms-2" (click)="delete(p.id)"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
     }
    </tbody>
  </table>
  </div>

</div>

@if (data?.result?.length > 0 && (data.totalCount) > productParams.pageSize ){
    <div class="row mt-3">
  <div class="col-xs-12 col-12">
    <pagination 
      (pageChanged)="onPageChange($event)"
      [totalItems]="data.totalCount" 
      [itemsPerPage]="productParams.pageSize" 
      [(ngModel)]="productParams.pageNumber"
      previousText="&lsaquo;"
      nextText="&rsaquo;"
      firstText="&laquo;"
      lastText="&raquo;"
    ></pagination>
  </div>
</div>
   }
