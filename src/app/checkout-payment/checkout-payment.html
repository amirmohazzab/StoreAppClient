<div class="row">
  <h3 class="text-muted mt-3"> Choose Bank Gateway </h3>
  @if (!transferToPortal) {
    <div class="col-md-12">
      <div class="row text-center">
  @for (item of PortalType | showEnum; track $index) {
    <div class="col-4">
      
      @switch (item.key) {
        @case ("1") {
          <img src="img-portal/mellat.png" class="img-thumbnail mb-2" />
        }
        @case ("2") {
          <img src="img-portal/parsian.png" class="img-thumbnail mb-2" />
        }
        @case ("3") {
          <img src="img-portal/zarrinpal.png" class="img-thumbnail mb-2" />
        }
      }

      <!-- radio + label under image -->
      <div class="mt-2">
        <input
          class="form-check-input cursor-pointer"
          [checked]="item.key == portalSelected"
          (change)="onChangePortal(item.key)"
          type="radio"
          [value]="item.key"
        />

        <label class="form-check-label mx-2">
          Bank Gateway {{ item.value }}
        </label>
      </div>

    </div>
  }
</div>
    </div>
  }
  @if (transferToPortal) {
    <div class="col-md-12">
      <div class="alert alert-primary text-center mt-2">
        <h1><span class="fas fa-exclamation-triangle fa-2x"></span></h1>
        <p class="lead"> Transfer to Bank Gateway </p>
        <div class="btn-group">
          <span class="fas fa-credit-card fa-3x"></span>
        </div>
      </div>
    </div>
  }
</div>
@if (!transferToPortal) {
  <div class="row">
    <div class="container-fluid mt-3">
      <a (click)="submitPayment()" routerLinkActive="router-link-active" class="btn btn-success w-100"> Final Payment </a>
    </div>
  </div>
}
